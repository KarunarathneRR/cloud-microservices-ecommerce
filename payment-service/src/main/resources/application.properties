# ========================================
# SERVER CONFIGURATION
# ========================================
# Server port for payment-service microservice
# Using 8082 to avoid conflict with user-service (8081)
server.port=8082

# Application name
spring.application.name=payment-service

# ========================================
# H2 DATABASE CONFIGURATION
# ========================================
# H2 in-memory database URL (data persists during runtime, clears on restart)
spring.datasource.url=jdbc:h2:mem:paymentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ========================================
# JPA/HIBERNATE CONFIGURATION
# ========================================
# Auto-create/update database schema based on entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 dialect for Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ========================================
# H2 CONSOLE CONFIGURATION
# ========================================
# Enable H2 web console for database inspection
spring.h2.console.enabled=true

# H2 console path: http://localhost:8082/h2-console
spring.h2.console.path=/h2-console

# Allow H2 console access from any IP (use with caution in production)
spring.h2.console.settings.web-allow-others=false

# ========================================
# PAYMENT GATEWAY SIMULATION
# ========================================
# Simulate payment gateway delay (milliseconds)
payment.gateway.delay=1000

# Simulate payment failure rate (0.0 to 1.0, where 0.2 = 20% failure rate)
payment.gateway.failure-rate=0.2

# ========================================
# LOGGING CONFIGURATION
# ========================================
# Set logging level for application
logging.level.com.ecommerce.paymentservice=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# ========================================
# SWAGGER/OPENAPI CONFIGURATION
# ========================================
# Swagger UI path: http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# API docs path: http://localhost:8082/v3/api-docs
springdoc.api-docs.path=/v3/api-docs

# ========================================
# MICROSERVICES INTEGRATION
# ========================================
# Order Service URL (for future inter-service communication)
# In production, use service discovery like Eureka or Consul
order.service.url=http://localhost:8083
